services:
  backend:
    environment:
      SPRING_PROFILES_ACTIVE: prod
      COOKIE_SECURE: "true"
      CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:?Configure PUBLIC_ORIGIN con https}

  frontend:
    ports: !override
      - "${HTTP_PORT:-8080}:8080"
      - "${HTTPS_PORT:-8443}:8443"
    volumes:
      - ${TLS_CERT_PATH:?Configure TLS_CERT_PATH}:/etc/nginx/tls/tls.crt:ro
      - ${TLS_KEY_PATH:?Configure TLS_KEY_PATH}:/etc/nginx/tls/tls.key:ro
      - ./frontend/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
