services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agua_pura}
      POSTGRES_USER: ${POSTGRES_USER:-agua_pura_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-database-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agua_pura_app} -d ${POSTGRES_DB:-agua_pura}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - agua_pura_network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-agua_pura}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-agua_pura_app}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change-this-database-password}
      JWT_ISSUER: ${JWT_ISSUER:-agua-pura-local}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:-Y2hhbmdlLXRoaXMtZGV2ZWxvcG1lbnQtc2VjcmV0LWtleS0xMjM0NTY3ODkw}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-7}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      STORAGE_PATH: ${STORAGE_PATH:-/app/storage}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.invalid}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-replace-with-a-long-random-password}
      BOOTSTRAP_ADMIN_FORCE_PASSWORD_CHANGE: ${BOOTSTRAP_ADMIN_FORCE_PASSWORD_CHANGE:-true}
      FEL_ENABLED: ${FEL_ENABLED:-false}
      FEL_PROVIDER_CODE: ${FEL_PROVIDER_CODE:-}
      FEL_CREDENTIAL_SECRET_REF: ${FEL_CREDENTIAL_SECRET_REF:-}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - file_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - agua_pura_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - agua_pura_network
    restart: unless-stopped

networks:
  agua_pura_network:
    driver: bridge

volumes:
  postgres_data:
  file_storage:
